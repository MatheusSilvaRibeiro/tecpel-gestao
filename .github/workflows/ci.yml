name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  quality:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Instalar pnpm
        uses: pnpm/action-setup@v4
        with:
          run_install: false

      - name: Configurar Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Instalar dependências
        run: pnpm install --frozen-lockfile

      - name: Gerar Prisma Client
        run: pnpm --filter @tecpel/backend prisma:generate

      - name: Verificar lint
        run: pnpm lint

      - name: Testar backend
        run: pnpm --filter @tecpel/backend test

      - name: Testar frontend
        run: pnpm --filter @tecpel/frontend test

      - name: Testar integração com PostgreSQL
        run: pnpm --filter @tecpel/backend test:integration

      - name: Compilar backend
        run: pnpm --filter @tecpel/backend build

      - name: Compilar frontend
        run: pnpm --filter @tecpel/frontend build

      - name: Validar Docker Compose de produção
        env:
          POSTGRES_DB: tecpel_ci
          POSTGRES_USER: tecpel_ci
          POSTGRES_PASSWORD: ci-only-password
          DATABASE_URL: postgresql://tecpel_ci:ci-only-password@postgres:5432/tecpel_ci?schema=public
          JWT_SECRET: ci-only-secret-with-at-least-32-characters
          CORS_ORIGIN: https://tecpel.invalid
        run: docker compose -f docker-compose.prod.yml config --quiet

      - name: Construir imagem de produção do backend
        run: docker build --target production -f backend/Dockerfile .

      - name: Construir imagem de produção do frontend
        run: docker build --target production -f frontend/Dockerfile .
