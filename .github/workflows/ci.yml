name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  quality:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Instalar pnpm
        uses: pnpm/action-setup@v4
        with:
          run_install: false

      - name: Configurar Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Instalar dependências
        run: pnpm install --frozen-lockfile

      - name: Verificar lint
        run: pnpm lint

      - name: Testar backend
        run: pnpm --filter @tecpel/backend test

      - name: Testar integração com PostgreSQL
        run: pnpm --filter @tecpel/backend test:integration

      - name: Compilar backend
        run: pnpm --filter @tecpel/backend build

      - name: Compilar frontend
        run: pnpm --filter @tecpel/frontend build
